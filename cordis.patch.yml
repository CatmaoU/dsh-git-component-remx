# dsh-git-component-remx bundle layer — applied when a profile lists this bundle
# (package.json declares `dsh.bundle.patch` pointing at this file).
#
# The row id `git-component-remx` is the loader entry id for this companion
# bundle. The client module is served at /plugins/dsh-git-component-remx/client.js
# via the package's `dsh.client` declaration (exports["./client"]). Keeping both
# the entry id and the package name distinct from the source plugin
# dsh-git-component lets the two bundles coexist in one profile without loader
# entry collisions or duplicate /git-component/* HTTP routes.
#
# `inject: [webServer, shell]` matters: profile activation is
# service-availability driven, so without it this row could apply before
# webServer/shell exist and silently no-op (no routes, no panel).
- insert:
    - id: git-component-remx
      name: dsh-git-component-remx
      inject:
        - webServer
        - shell